name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate plugin and marketplace (strict)
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate --strict ./.claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code plugin validate --strict .
      - name: Shell scripts
        run: |
          test -x scripts/supersend
          test -x scripts/session-brief.sh
          shellcheck --severity=warning scripts/supersend scripts/session-brief.sh
